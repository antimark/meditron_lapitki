# ============================================================
# LOCAL MODEL
# ============================================================

[models]

# Enable local inference.
local_enabled = true

# Load the model directly with Hugging Face Transformers.
#
# Available:
#   transformers
#   openai_compatible
#   disabled
local_backend = "transformers"

# Alias is resolved through:
# config/local_models.json
#
# qwen_1_5b ->
# Qwen/Qwen2.5-1.5B-Instruct
model_alias = "qwen_1_5b"

# Leave empty to download/use the Hugging Face model_id
# specified by model_alias.
#
# You can later put a local model or LoRA adapter path here.
local_model_path = ""

# Not used when local_backend = "transformers".
# Kept for compatibility in case the local model is later
# moved into vLLM / TGI / another OpenAI-compatible server.
local_base_url = ""
local_api_key = ""

# auto:
#   CUDA if available
#   Apple MPS if available
#   otherwise CPU
local_device = "auto"

local_dtype = "auto"

# Maximum generated response length per prompt.
local_max_new_tokens = 1100
local_max_retries = 1

# Deterministic extraction.
local_temperature = 0.0

# Fields are grouped into prompts according to clinical section.
local_grouped_prompts = true

# Maximum amount of source text supplied to a local LLM batch.
local_max_input_chars = 14000


# ============================================================
# EXTERNAL API MODEL
# ============================================================

[api]

enabled = true

# Current implementation expects an OpenAI-compatible
# /chat/completions endpoint.
protocol = "openai_compatible"

# Values are loaded from .env.
#
# Examples:
#
# LLM_API_BASE_URL=https://api.openai.com/v1
#
# or another provider exposing an OpenAI-compatible endpoint.
base_url = "${LLM_API_BASE_URL}"

model = "${LLM_API_MODEL}"

# Do not store the actual key in this file.
api_key = ""
api_key_env = "LLM_API_KEY"

timeout_seconds = 90

# Number of retries in addition to the initial request.
max_retries = 2

# Deterministic extraction.
temperature = 0.0

max_tokens = 1200

# External API is an adjudicator after rules/local extraction.
#
# all       -> external API processes all requested fields
# uncertain -> API only processes fields unresolved after
#              regex + local model
# disabled  -> API disabled
mode = "uncertain"

# Used only when:
# mode = "uncertain"
uncertain_score_below = 0.88

max_input_chars = 14000


# ============================================================
# RUNTIME
# ============================================================

[runtime]

threads = 4

# Used by folder-processing CLI.
# Do not confuse this with Gunicorn workers.
folder_workers = 4

batch_size = 8

# CPU threads available to Torch.
torch_num_threads = 4
torch_num_interop_threads = 1

hf_tokenizers_parallelism = false


# ============================================================
# EXTRACTION PIPELINE
# ============================================================

[pipeline]

# Deterministic extraction remains the first layer.
use_regex = true

# Conservative typo-corrected shadow extraction.
use_typo_layer = true

# Enable local Qwen.
use_local = true

# Enable external API model.
use_api = true

# Run local Qwen only where deterministic extraction is not already high-confidence.
#
# all       -> always call local model
# uncertain -> only call it for low-confidence regex fields
# disabled  -> local model disabled
local_mode = "uncertain"

# Used when local_mode = "uncertain".
regex_skip_local_score = 0.94

# Candidate must reach at least this score to participate.
min_candidate_score = 0.25

write_context = true
write_score = true

# LLM answers must point to exact evidence in source text
# before they can win arbitration.
require_exact_llm_evidence = true
# Do not call an LLM just because a whole source section is absent.
route_missing_only_if_source_section_present = true


# ============================================================
# CLUSTERING
# ============================================================


[orchestration]
# The whole batch is analyzed first. A small representative/diverse subset is
# then processed as calibration probes before the remaining files.
enabled = true
probe_files = 5
# Legacy alias retained for backwards compatibility with older scripts.
warmup_files = 5

# Probe files: rules and API see the same fields. Local LLM is used only when
# they disagree, including one-sided coverage gaps (regex missing, API evidenced).
probe_api_mode = "all"
probe_local_on_disagreement = true
fallback_local_if_api_unavailable = true

# Normal routing remains cheap unless calibration expands selected fields.
normal_local_mode = "uncertain"
normal_api_mode = "uncertain"

# Representative + diversity sampling over the whole batch.
sampling_semantic_weight = 0.65
sampling_extraction_mask_weight = 0.35
sampling_include_template_shift = true
sampling_noise_template_penalty = 0.75
sampling_noise_diversity_penalty = 0.90

# Compare batch-wide deterministic field presence with the open train-100
# baseline. A material drop can pre-emptively expand API routing for that field.
train_regex_baseline_file = "config/train_regex_baseline.json"
use_batch_shift_for_routing = true
batch_shift_min_documents = 5
batch_shift_min_train_presence = 0.25
batch_shift_presence_drop = 0.20

# Adaptive policy learned from probe comparison.
adaptive_min_probe_observations_global = 3
adaptive_min_probe_observations_cluster = 1
adaptive_regex_gap_rate = 0.30
adaptive_cluster_regex_gap_rate = 0.50
adaptive_semantic_conflict_rate = 0.20
adaptive_cluster_semantic_conflict_rate = 0.50

# Conservative optional arbitration boost for evidenced LLM candidates only.
# Routing expansion is the primary adaptation; this bonus is deliberately small.
adaptive_llm_bonus_enabled = true
adaptive_llm_bonus_api_always = 0.015
adaptive_llm_bonus_both_always = 0.025


# ============================================================
# OPTIONAL BATCH SIMILARITY / PEER SIGNAL
# ============================================================

[batch_similarity]
enabled = true
min_batch_documents = 5
# HDBSCAN determines the number of clusters itself and can leave outliers as -1.
method = "hdbscan"
stopwords_file = "config/cluster_stopwords.txt"
auto_stopword_docfreq = 0.95
frequency_top_terms = 80
max_features = 10000
ngram_min = 1
ngram_max = 2
min_df = 2
max_df = 0.90
svd_components = 30
min_cluster_size = 5
min_samples = 2
cluster_selection_method = "eom"
allow_single_cluster = false
random_state = 42
cluster_top_terms = 20

# Only high-confidence deterministic previews contribute peer priors.
peer_min_preview_score = 0.90
clinical_similarity_threshold = 0.72
clinical_min_shared_weight = 3.0
clinical_max_neighbors = 12
peer_cluster_prior_weight = 0.55
peer_clinical_prior_weight = 0.45

# Peer values are a weak tie-breaker between candidates already supported by
# the current document. They can never create/fill a value.
use_peer_value_tiebreak = true
peer_value_tiebreak_weight = 0.035
peer_tiebreak_margin = 0.08
peer_value_fields = [
  "art_hyper", "atr_fibril", "ckd", "copd", "diagnosis_icd", "dm", "hf",
  "killip", "mi_localisation", "tlt", "type_acs", "ecg_avb", "ecg_elevation",
  "ecg_rythm", "ca_fact", "ca_lad", "rca"
]

# File-level score adjustment. Total cohort influence is bounded to +/- 0.05.
score_cluster_presence_weight = 0.025
score_clinical_presence_weight = 0.025
score_consistency_reference = 0.85
score_max_negative_adjustment = 0.05
# Cohort similarity is used as an anomaly penalty by default, not as a confidence booster.
score_max_positive_adjustment = 0.0

